site_name: Logust
site_description: Fast, Rust-powered Python logging with a loguru-style API, JSON output, and file rotation.
site_url: https://yamaaaaaa31.github.io/logust/
site_author: yamaaaaaa31
repo_url: https://github.com/yamaaaaaa31/logust
repo_name: yamaaaaaa31/logust
edit_uri: edit/main/docs/
copyright: Copyright (c) 2025 yamaaaaaa31

theme:
  name: material
  language: en
  palette:
    - media: (prefers-color-scheme)
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: octicons/mark-github-24
    edit: material/pencil
  logo: assets/logo.svg
  favicon: assets/favicon.svg

nav:
  - Logust: index.md
  - features.md
  - Learn:
      - learn/index.md
      - Tutorial - User Guide:
          - tutorial/index.md
          - tutorial/first-steps.md
          - tutorial/log-levels.md
          - tutorial/message-arguments.md
          - tutorial/sinks.md
          - tutorial/file-output.md
          - tutorial/rotation-retention.md
          - tutorial/formatting.md
          - tutorial/json-output.md
          - tutorial/context.md
          - tutorial/exceptions.md
          - tutorial/filters.md
      - Advanced User Guide:
          - advanced/index.md
          - advanced/custom-levels.md
          - advanced/records-and-patch.md
          - advanced/opt.md
          - advanced/callbacks.md
          - advanced/library-logging.md
          - advanced/tracebacks.md
          - advanced/async-writes.md
          - advanced/sink-errors.md
          - advanced/threads-and-processes.md
          - advanced/performance.md
          - advanced/parsing.md
          - advanced/canonical-events.md
      - How To - Recipes:
          - how-to/index.md
          - how-to/intercept-standard-logging.md
          - how-to/fastapi.md
          - how-to/timing-decorators.md
          - how-to/progress-bars.md
          - how-to/migrate-from-loguru.md
          - how-to/migrate-from-logging.md
  - Reference: reference/index.md
  - About:
      - about/index.md
      - about/alternatives.md
      - about/benchmarks.md
  - release-notes.md

markdown_extensions:
  abbr:
  attr_list:
  def_list:
  footnotes:
  md_in_html:
  tables:
  toc:
    permalink: true
  pymdownx.betterem:
    smart_enable: all
  pymdownx.caret:
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    linenums_style: pymdownx-inline
    pygments_lang_class: true
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.mark:
  pymdownx.snippets:
    base_path: ["."]
    check_paths: true
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tilde:
  pymdownx.blocks.admonition:
    types:
      - note
      - attention
      - caution
      - danger
      - error
      - tip
      - hint
      - warning
      - info
      - check
  pymdownx.blocks.details:
  pymdownx.blocks.tab:
    alternate_style: true

plugins:
  - search
  - redirects:
      redirect_maps:
        getting-started/installation.md: tutorial/index.md
        getting-started/quick-start.md: tutorial/first-steps.md
        guide/levels.md: tutorial/log-levels.md
        guide/file-output.md: tutorial/file-output.md
        guide/formatting.md: tutorial/formatting.md
        guide/context.md: tutorial/context.md
        guide/exceptions.md: tutorial/exceptions.md
        guide/integrations.md: how-to/index.md
        guide/canonical-events.md: advanced/canonical-events.md
        api.md: reference/index.md
        comparison.md: about/alternatives.md
  - minify:
      minify_html: true

extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: octicons/mark-github-24
      link: https://github.com/yamaaaaaa31/logust
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/logust/

extra_css:
  - css/termynal.css
  - css/custom.css

extra_javascript:
  - js/termynal.js
  - js/custom.js
