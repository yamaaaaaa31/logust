name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: ubuntu-latest
            python-version: '3.14t'
          - os: macos-latest
            python-version: '3.14t'
          - os: windows-latest
            python-version: '3.14t'
          - os: ubuntu-latest
            python-version: '3.15t'
          - os: macos-latest
            python-version: '3.15t'
          - os: windows-latest
            python-version: '3.15t'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies and build
        run: |
          uv venv --python python
          uv pip install maturin pytest pytest-cov rich
          uv run maturin develop

      - name: Verify free-threaded interpreter and import
        if: endsWith(matrix.python-version, 't')
        run: >-
          uv run python -c "import sys, sysconfig, logust;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
          assert not sys._is_gil_enabled(), 'Importing logust enabled the GIL'"

      - name: Run tests
        run: uv run pytest tests/ -v --cov=logust --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  web-integration-test:
    name: Web Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies and build
        run: |
          uv venv
          uv pip install maturin pytest httpx fastapi starlette uuid-utils
          uv run maturin develop

      - name: Run web integration tests
        run: uv run pytest tests/test_web_integration.py -v

  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies and build
        run: |
          uv venv
          uv pip install maturin ruff mypy
          uv run maturin develop

      - name: Ruff check
        run: uv run ruff check logust/

      - name: Ruff format check
        run: uv run ruff format --check logust/

      - name: Mypy
        run: uv run mypy logust --ignore-missing-imports
